# Render — Django Overdue Service
# Use the SAME PostgreSQL database as Laravel (set env vars manually in Render dashboard).

services:
  - type: web
    name: pms-django-overdue
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn project_management_system.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
